# Asia paper-shadow (parallel track — no live equity impact)
asia_shadow:
  enabled: true
  hours: [0, 1, 3, 4, 5, 6]   # exclude 02, 07 UTC (weak in backtest)
  max_positions: 8
  report_hour_utc: 8

# Signal shadow (logging-only — snapshots every cascade bar + forward R-paths)
# No BTC regime gate: logs neutral, bear, AND bull entries for offline research.
# Live book uses plain + TSL variants in parallel so retunes can be validated here first.
signal_shadow:
  enabled: true
  # Portfolio caps: null max_concurrent = log everything (50+ parallel).
  # Set max_concurrent to 5-10 to rehearse live transition sizing in shadow.
  portfolio:
    max_concurrent: null
    max_per_symbol_session: 1
    max_net_delta: null
  intraday_burst_shadow:
    enabled: true
    min_volume_usd_30m: 20000
    min_events_30m: 3
    dedup_bars: 3
