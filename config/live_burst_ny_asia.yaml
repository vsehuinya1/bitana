# Live mainnet: NY-open flush buy + Asia pump short (plain 4h time exit)
# Run: python main.py --config config/live_burst_ny_asia.yaml
# Requires .env: BINANCE_TESTNET=false, API keys with futures + universal transfer
#
# Retuned Jul 15 from enriched shadow logs:
#   - Plain time exit beats TSL on both books
#   - NY skips Mondays and weekends (UTC)
#   - Asia skips weekends Sat/Sun UTC bar time (Jul 19)
#   - 10% risk per position (ops bump Aug 11); max_leverage 100 (Aug 12) so slot sizing can reach target
#   - Live gate: NY neutral (h16-17) + bull (h14-15,17 @ 8 ATR); Asia neutral-only (Aug 20-21)

config_version: "1.1.1"
mode: "live"

engines:
  compression_enabled: false
  squeeze_enabled: false
  burst_follow_enabled: true

symbols:
  active:
    - BTCUSDT
    - SOLUSDT
    - ETHUSDT
    - WLDUSDT
    - XRPUSDT
    - NEARUSDT
    - ZECUSDT
    - APTUSDT
    - ADAUSDT
    - UNIUSDT
  defaults:
    risk_pct: 10.0

timeframes:
  regime: "15m"
  primary: "5m"
  confirmation: "1m"

risk:
  default_risk_pct: 10.0
  reduced_risk_pct: 7.0
  drawdown_reduce_threshold: 0.15
  drawdown_restore_threshold: 0.10
  max_leverage: 100
  liquidation_buffer_pct: 0.05

brakes:
  daily_loss_limit_pct: 0.20
  consecutive_loss_threshold: 3
  consecutive_loss_reduced_trades: 5
  equity_pause_drawdown: 0.35
  equity_shutdown_drawdown: 0.50

stops:
  compression:
    method: "structure_or_atr"
    atr_multiplier: 1.5
  squeeze:
    method: "trigger_extreme"
    buffer_pct: 0.002

profit_taking:
  partial_close_pct: 0.50
  partial_close_r: 1.5
  trail_atr_multiplier: 1.0
  time_stop_r_threshold: 1.0
  time_stop_candles: 8

portfolio:
  max_concurrent_positions: 6
  max_per_symbol: 1
  max_cluster_positions: 6
  cluster_window_minutes: 15
  limit_by_engine: true
  btc_priority: true
  correlation_require_independent: false
  correlation_sizing_reduction: 0.0

execution:
  max_spread_bps: 15.0
  max_slippage_bps: 10.0
  partial_fill_timeout_s: 30
  client_order_id_prefix: "BITANA"

reconciliation:
  interval_s: 30
  external_position_stop_atr_mult: 2.0

regime_filters:
  enabled: true
  min_atr_15m: 0.001
  avoid_low_vol_drift: true
  session_filter:
    enabled: false
  blackout_windows: []

fees:
  taker_bps: 4.0
  maker_bps: 2.0
  default_slippage_bps: 2.0

telegram:
  enabled: true
  flatten_confirm_timeout_s: 30
  max_log_lines: 50

health:
  enabled: true
  host: "0.0.0.0"
  port: 8082

logging:
  level: "INFO"
  file: "logs/bitana-live-burst.log"
  trade_file: "logs/trades-live-burst.jsonl"
  max_bytes: 52428800
  backup_count: 10
  retention_days: 30

data:
  candle_history_limit: 500
  rest_candle_check_interval_s: 60
  ws_reconnect_max_retries: 10
  ws_reconnect_base_delay_s: 1.0
  server_time_sync_interval_s: 300

rate_limiter:
  order_weight_per_minute: 1200
  data_weight_per_minute: 2400
  warn_threshold_pct: 0.80

watchdog:
  heartbeat_interval_s: 30
  max_restart_attempts: 5
  restart_backoff_base_s: 2.0

squeeze:
  enabled: false

burst_follow:
  enabled: true
  # Paper owns the !forceOrder@arr WS writer (force_orders_paper.db). Live must
  # not open a second WS on the same IP — Binance only feeds one client, which
  # left live's DB stale after FO isolation (Tue Asia blind). Read paper FO DB.
  force_order_db_path: storage/force_orders_paper.db
  force_order_read_only: true
  liq_cache_db_path: storage/v5_forward_test.db
  min_burst_volume_30m: 20000
  min_burst_events_30m: 3
  dedup_bars: 3
  risk_pct: 10.0
  btc_regime_gate_enabled: true
  allowed_btc_regimes: ["neutral", "bear"]
  session_rules:
    asia:
      shadow_strategy: asia_pump_short_4h
      side_mode: follow
      neg_imb_only: true
      min_imb: 0.5
      exclude_weekdays: [5, 6]
      allowed_btc_regimes: ["neutral"]
      stop_atr: 10.0
      tp_atr: 999.0
      time_bars: 48
      time_exit_only: true
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 2
    ny:
      # Aug 10: NY-A early only (h14-15); D7 (NY-B) reverted — Early alone better in-sample
      # Aug 20: bull opened behind separate h14-15 window (10 ATR). Neutral stays [16,17].
      # Aug 21: bull hours -> [14,16,17]: h15 dropped (shadow -1.5R avg, 0/3 days pos),
      #         h16 added (+1.18R avg n6, both days pos). h17 kept (Aug19-concentrated, kill criteria cover).
      #         h19 added (+13.4R/9, +1.49R avg, 4/5 days pos) — watchlist promoted same day,
      #         thin n=9; kill criteria apply at n>=10.
      shadow_strategy: ny_flush_buy_4h
      side_mode: follow
      pos_imb_only: true
      min_imb: 0.5
      exclude_weekdays: [0, 5, 6]
      hours: [16, 17]
      regime_hours:
        bull: [14, 16, 17, 19]
      regime_stop_atr:
        bull: 8.0
      allowed_btc_regimes: ["neutral", "bull"]
      stop_atr: 10.0
      tp_atr: 999.0
      time_bars: 48
      time_exit_only: true
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 2

    london:
      # Aug 21: G0 forward-test — burst_follow LONG, bull only.
      # Shadow (closed set, h8-13 bull): +32.0R/83, +0.385/trade, WR 64%, 6/8 days pos,
      #   Aug OOS +0.29R/trade. Exit mix: 92% time (+0.14), 8% TP3 (+3.0), 0 stops.
      #   NOTE Aug 21: time_bars=6 on 5m bars = 30 MINUTES (not 3h; earlier docs wrong).
      #   Validated vs shadow: 5m replay reproduces +32.2R/83, mix 7tp/76time/0sl exactly.
      # Aug 21 (later): time exit extended 30m -> 120m (time_bars 6 -> 24). Post-exit
      #   kline counterfactual (142 clean paths, TP3+10ATR kept): mean +0.36R/PF1.89 @30m
      #   vs +0.75R/PF2.13 @120m; legacy-only n59 same shape (+0.32 -> +0.61). Per-day not
      #   uniform: Jul-29/Aug-12 degrade ~-2R/day on chop. 360m looks better but is
      #   morning-entry selection bias. Kill criteria unchanged.
      # Known fragility: Jul16 = 57% of P&L; would_live_accept subset n27 -6.0R (thin).
      # Kill criteria: net/trade < +0.2R after 30 accepted, or top-day > 40% of live P&L -> freeze.
      # No min_decile floor: d1 is best bucket (+17.5R/57).
      # Aug 24: WIRED noTP/180m (time_bars 36, tp 999) on owner instruction pre-window
      #   (~07:54Z, before first eligible entry). Mirrors PREREG-LONDHOLD T1 arm
      #   (+0.099R/tr weekday core n115 vs live TP3@120m +0.071; 58% wr; trend-day
      #   concentrated). Shadow UNCHANGED at TP3@30m (6-bar; verified 2026-08-24 via hold-time dist max=30min all days + 38/38 replay match on the day's LONGs) — reader baseline/validation intact.
      shadow_strategy: burst_follow
      side_mode: follow
      pos_imb_only: true
      min_imb: 0.5
      exclude_weekdays: [5, 6]
      hours: [8, 9, 10, 11, 12, 13]
      allowed_btc_regimes: ["bull"]
      stop_atr: 10.0
      tp_atr: 999.0
      time_bars: 36
      time_exit_only: false
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 1

database:
  path: "data/bitana-live-burst.db"
