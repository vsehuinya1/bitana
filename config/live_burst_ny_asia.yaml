# Live mainnet: NY-open flush buy + Asia pump short (plain 4h time exit)
# Run: python main.py --config config/live_burst_ny_asia.yaml
# Requires .env: BINANCE_TESTNET=false, API keys with futures + universal transfer
#
# Retuned Jul 15 from enriched shadow logs:
#   - Plain time exit beats TSL on both books
#   - NY skips Mondays and weekends (UTC)
#   - Asia skips weekends Sat/Sun UTC bar time (Jul 19)
#   - 24% risk per position (ops bump Aug 11); max_leverage 100 (Aug 12) so slot sizing can reach target
#   - Live gate: NY neutral (h16-17) + bull (h14-15,17 @ 8 ATR); Asia neutral-only (Aug 20-21)
#
# ===== EQUITY FLOORS FOR $5 MIN-NOTIONAL (cap-6) =====
# London LONG book (n=949 closed): stop widths p50 3.5% | p95 10.0% | max 15.4%
# Formula: equity >= 5 * stop_width / risk_pct
#
# DEFAULT tier (24%):
#   p50  3.5% -> $0.73    p95 10.0% -> $2.08    max 15.4% -> $3.21
# REDUCED tier (21%):
#   p50  3.5% -> $0.83    p95 10.0% -> $2.38    max 15.4% -> $3.67
#
# At $3.45 equity (yesterday): 24% clears $5 even at max stop; 21% clears up to ~14.3% stop (~98% of book)
# NOT covered: BTCUSDT ($50 min), ETHUSDT ($20 min) — ETH fires only on <~4% stop widths, BTC effectively dark until funded.

config_version: "1.1.1"
mode: "live"

engines:
  compression_enabled: false
  squeeze_enabled: false
  burst_follow_enabled: true

symbols:
  active:
    - BTCUSDT
    - SOLUSDT
    - ETHUSDT
    - WLDUSDT
    - XRPUSDT
    - NEARUSDT
    - ZECUSDT
    - APTUSDT
    - ADAUSDT
    - UNIUSDT
  defaults:
    # 2026-08-30 owner: 24% -> 10% (wallet funded $3.45 -> $24.59; 24% was the
    # min-notional floor at $3.45, not an expectancy pick). At 10%: $5-min alts
    # clear $6.50 floor down to 2.6% stop widths; ETH ($20 min) fires <~8%;
    # BTC ($50 min) fires only <~5% widths — effectively dark. Owner-instructed.
    risk_pct: 10.0

timeframes:
  regime: "15m"
  primary: "5m"
  confirmation: "1m"

risk:
  # 2026-08-26: moved with symbols.defaults.risk_pct (all copies must move together).
  # 2026-08-30 owner: 24% -> 10% (moved with symbols.defaults.risk_pct —
  # all copies must move together).
  default_risk_pct: 10.0
  # 2026-08-30: 21.0 -> 8.75 (proportional 0.875× of new default 10%).
  # At $24.59 equity clears $6.50 floor for stop widths <=21.4% — 100% of book.
  reduced_risk_pct: 8.75
  drawdown_reduce_threshold: 0.15
  drawdown_restore_threshold: 0.10
  max_leverage: 100
  liquidation_buffer_pct: 0.05

brakes:
  # 2026-08-28 owner: daily brake 50% -> 40% (yesterday's 50% trigger took too
  # long to clear and cost entries).
  # 2026-08-29 owner: 40% -> 60%.
  # 2026-08-29 owner: 60% -> 85% (counterfactual: worst observed day at 21% reduced risk = 79.9%;
  # 85% limit survives worst day while catching true blowups).
  # 2026-08-30 owner: 85% -> 50% after risk cut 24% -> 10% (85% = 8.5 stop-outs at 10%;
  # worst observed day scales to ~38% at 10% risk, so 50% still survives it = 5 stop-outs).
  daily_loss_limit_pct: 0.50
  consecutive_loss_threshold: 3
  consecutive_loss_reduced_trades: 5
  equity_pause_drawdown: 0.35
  equity_shutdown_drawdown: 0.50

stops:
  compression:
    method: "structure_or_atr"
    atr_multiplier: 1.5
  squeeze:
    method: "trigger_extreme"
    buffer_pct: 0.002

profit_taking:
  partial_close_pct: 0.50
  partial_close_r: 1.5
  trail_atr_multiplier: 1.0
  time_stop_r_threshold: 1.0
  time_stop_candles: 8

portfolio:
  max_concurrent_positions: 8
  max_per_symbol: 1
  # 2026-08-31 owner (empirical): cluster cap 6 -> 3. Shadow leg-index evidence
  # (2026-07-14..08-31, full closed): pooled legs 1-6 all ~0R (leg7 -0.032R PF 0.65);
  # ny_flush legs4+ -0.042R n=170 (Aug -0.067); asia size-4 clusters -0.64R avg
  # (4/7 negative, diffuse across dates); asia legs4+ +0.140 Aug is top-day-concentrated
  # (2026-08-27 = 45% of net, n=3 in Jul) -> no marginal edge beyond 3 legs.
  # Worst-case book share per event: 3/8 = 37.5% (was 6/8 = 75%).
  max_cluster_positions: 3
  # 2026-08-31 (owner order): same-cluster aggregate-risk cap, sizing-only.
  # Legs 2-3 sized down so SUM of same-bucket risk-to-stop <= 15% of equity
  # (was unbounded: 3 legs x 8.75% = 26.25% on one 15-min event). Budget
  # exhausted -> entry skipped. 0 = off.
  max_cluster_risk_pct: 15.0
  cluster_window_minutes: 15
  limit_by_engine: true
  btc_priority: true
  correlation_require_independent: false
  correlation_sizing_reduction: 0.0

execution:
  max_spread_bps: 15.0
  max_slippage_bps: 10.0
  partial_fill_timeout_s: 30
  client_order_id_prefix: "BITANA"

reconciliation:
  interval_s: 30
  external_position_stop_atr_mult: 2.0

regime_filters:
  enabled: true
  min_atr_15m: 0.001
  avoid_low_vol_drift: true
  session_filter:
    enabled: false
  blackout_windows: []

fees:
  taker_bps: 4.0
  maker_bps: 2.0
  default_slippage_bps: 2.0

telegram:
  enabled: true
  flatten_confirm_timeout_s: 30
  max_log_lines: 50

health:
  enabled: true
  host: "0.0.0.0"
  port: 8082

logging:
  level: "INFO"
  file: "logs/bitana-live-burst.log"
  trade_file: "logs/trades-live-burst.jsonl"
  max_bytes: 52428800
  backup_count: 10
  retention_days: 30

data:
  candle_history_limit: 500
  rest_candle_check_interval_s: 60
  ws_reconnect_max_retries: 10
  ws_reconnect_base_delay_s: 1.0
  server_time_sync_interval_s: 300

rate_limiter:
  order_weight_per_minute: 1200
  data_weight_per_minute: 2400
  warn_threshold_pct: 0.80

watchdog:
  heartbeat_interval_s: 30
  max_restart_attempts: 5
  restart_backoff_base_s: 2.0

squeeze:
  enabled: false

burst_follow:
  enabled: true
  # Paper owns the !forceOrder@arr WS writer (force_orders_paper.db). Live must
  # not open a second WS on the same IP — Binance only feeds one client, which
  # left live's DB stale after FO isolation (Tue Asia blind). Read paper FO DB.
  force_order_db_path: storage/force_orders_paper.db
  force_order_read_only: true
  liq_cache_db_path: storage/v5_forward_test.db
  min_burst_volume_30m: 20000
  min_burst_events_30m: 3
  dedup_bars: 3
  # 2026-08-30: moved with symbols.defaults (owner 24% -> 10%).
  risk_pct: 10.0
  btc_regime_gate_enabled: true
  allowed_btc_regimes: ["neutral", "bear"]
  session_rules:
    asia:
      shadow_strategy: asia_pump_short_4h
      side_mode: follow
      neg_imb_only: true
      min_imb: 0.5
      # 2026-08-30 owner: block Tue (shadow asia_pump_short_4h Tue-neutral
      # n=33 -0.086R PF 0.50, losses spread across hours, h00 worst -0.25R n9).
      # NOTE loader convention: 0=Mon..6=Sun. Sat+Sun were already excluded
      # pre-2026-08-30 ("weekends never traded" — owner confirmed correct).
      # 17:07Z edit [0,2,5,6] was WRONG (blocked Mon+Wed, left Tue open) —
      # caught on verification, corrected: [1,5,6] = Tue+Sat+Sun.
      exclude_weekdays: [1, 5, 6]
      allowed_btc_regimes: ["neutral"]
      stop_atr: 10.0
      tp_atr: 999.0
      time_bars: 48
      time_exit_only: true
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 2
    ny:
      # Aug 10: NY-A early only (h14-15); D7 (NY-B) reverted — Early alone better in-sample
      # Aug 20: bull opened behind separate h14-15 window (10 ATR). Neutral stays [16,17].
      # Aug 21: bull hours -> [14,16,17]: h15 dropped (shadow -1.5R avg, 0/3 days pos),
      #         h16 added (+1.18R avg n6, both days pos). h17 kept (Aug19-concentrated, kill criteria cover).
      #         h19 added (+13.4R/9, +1.49R avg, 4/5 days pos) — watchlist promoted same day,
      #         thin n=9; kill criteria apply at n>=10.
      shadow_strategy: ny_flush_buy_4h
      side_mode: follow
      pos_imb_only: true
      min_imb: 0.5
      exclude_weekdays: [0, 5, 6]
      hours: [16, 17]
      regime_hours:
        # 2026-08-28 owner order ("activate h18-20 for Friday London bull"): evidence
        # cell is THIS arm (ny_flush_buy_4h Fri-bull, single day Aug 21): h18 +3.28R n4,
        # h20 +0.59R n1; h19 already live. London arm (burst_follow) same cells flat
        # (+0.24R n32) — interpretation note. h18/h20 added FRIDAY-SCOPED via
        # excluded_weekday_hours below: ex-Fri bull h18 -2.52R n20 (Tue -2.21 n5,
        # Thu -0.39 n12), h20 Tue -2.54R n14 — global add would import Tue bleed.
        # Kill criteria: Fri h18/h20 + Wed h20 cells review at n>=10, kill if avg<0.
        # 2026-08-28 same-day owner call: Wed h20 wired (+4.25R n6, 6/6 win, spread
        # Jul22 +0.52 / Aug26 +3.73 — two Wednesdays); h18 Wed stays locked (+0.08R n3).
        bull: [14, 16, 17, 18, 19, 20]
      # 2026-08-26 owner instruction ("set the correct hours"): Tue-only drop of
      # h17/h19. ny_flush book (n=661 closed LONGs, live weekdays): Tue h17
      # -31.2R avg -3.9 (bull-regime -25.7), Tue h19 -16.8 vs Wed/Fri cells
      # +60R combined -> weekday-scoped exclusion, NOT whole-hour drop.
      # burst_follow full-history DISAGREES (+8.9 / +12.9) — Aug25 bleeder finding
      # was a last-4-Tuesdays phenomenon there; baseline caveat logged as plan
      # amendment, OOS-watch in RESEARCH_PLAN.md. Key = Python weekday(): 1=Tue.
      # 2026-08-31 owner order: allow Tue NEUTRAL h14 ("positive hours, even if
      # thin, only h14"). Shadow basis (ny_flush_buy_4h, neutral, Tue, dec>=2):
      # n=18 sumR +2.67 across only TWO days — 2026-07-07 n=9 +2.96 (single
      # cluster, pre-bucket era) and 2026-08-11 n=9 -0.28 (3 clusters, worst
      # 14:15Z 4-leg -1.16R). Top-day = 111% of net; ex-top-day NEGATIVE.
      # Known-fragile wire, owner-accepted. KILL: review at n>=10 live-accepted;
      # drop if net/trade < 0. Requires added_weekday_regime_hours (an exclusion
      # map cannot add hours without cutting live bull h14 on other days).
      added_weekday_regime_hours:
        1:
          neutral: [14]
      excluded_weekday_hours:
        # 2026-08-28: h18 Friday-only; h20 Friday+Wed (owner call, see note above).
        # Tue/Thu drops kept: h18 Tue -2.21 n5 / Thu -0.39 n12; h20 Tue -2.54 n14.
        # wd = python weekday (1=Tue, 2=Wed, 3=Thu); Mon/Sat/Sun out at session level.
        1: [17, 18, 19, 20]
        2: [18]
        3: [18, 20]
      regime_stop_atr:
        bull: 8.0
        neutral: 6.0
      allowed_btc_regimes: ["neutral", "bull"]
      stop_atr: 10.0
      tp_atr: 999.0
      time_bars: 48
      time_exit_only: true
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 2

      # RE-ENABLED 2026-08-26 ~07:30Z on owner instruction ("Wire London: TP3/SL10/30min,
      # drop h8 and h12"). Three deltas vs the Aug25-disabled state:
      #   1. Exit REVERTED to shadow baseline TP3@SL10@30m (tp_atr 3.0 / time_bars 6):
      #      Aug24 noTP/180m wiring had ZERO shadow history for this arm — all n=949
      #      closed london LONG trades ran TP3@30m; live tripped kill in 25 accepted
      #      (-0.048R/tr). Aug25 same-day replay of 12 live fills under TP3/30m:
      #      -0.44R vs -1.89R actual (0 tp / 12 time / 0 sl).
      #   2. Hours h8/h12 DROPPED on owner instruction. Shadow bleeders on the closed
      #      book (n=949): h8 -25R PF0.75, h12 -61R PF0.67. POST-HOC slice selection —
      #      logged as amendment, OOS-watch item (see RESEARCH_PLAN.md watch list).
      #   3. Sizing floor 24% so min-notional clears at $3.45 equity (see symbols.defaults).
      # Regime context (same book): bull +131.6R/346 PF1.96 vs neutral -43.3R PF0.85.
      # Kill criteria UNCHANGED: net/trade < +0.2R after 30 accepted, or top-day > 40%
      # of live P&L -> freeze.
      # INDENT FIX 2026-08-26: the previously-commented template was over-indented;
      # uncommenting verbatim nested it under session_rules.ny (extra="forbid" caught it).
    london:
      shadow_strategy: burst_follow
      side_mode: follow
      # Aug 24 owner pin: structural LONG-only; pos_imb_only already made this
      # de-facto true; pin makes it explicit and immune to imb/side_mode edits.
      allowed_side: LONG
      pos_imb_only: true
      min_imb: 0.5
      exclude_weekdays: [5, 6]
      # h9/h10/h11/h13 only — h8+h12 dropped (owner, Aug26), h14+ is NY territory.
      hours: [9, 10, 11, 13]
      allowed_btc_regimes: ["bull"]
      stop_atr: 10.0
      tp_atr: 3.0
      time_bars: 6
      time_exit_only: false
      min_cascade_strength: 0.0
      min_vol_z: 0.0
      min_n_confirms: 1
      min_decile: 1

database:
  path: "data/bitana-live-burst.db"