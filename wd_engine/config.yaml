# Wick catcher + perp discount engine (wd_engine/engine.py). Owner decisions 2026-10-03: $1 per R, both strategies,
# a sub-account with a smaller balance, a disaster stop. This file is the engine's only config; the live Bitana bot
# never reads it.

# dry = public data, simulated fills, no keys | testnet = futures testnet keys | live = sub-account keys.
# Switching to testnet / live is the owner's step (keys go in env_file).
mode: dry
env_file: /root/bitana/.env.wd          # WD_API_KEY=... / WD_API_SECRET=... (sub-account, futures trading only, no withdrawals)

r_usd: 1.0                               # $ per R; 1R = 3 x ATR1h. History at $1/R (2024-26): +$210, max drawdown -$84, worst day -$50
stop_r: 20                               # disaster stop, R under entry. Deepest intra-trade drop in 6 years on these coins: wick -16.6R
                                         # (FIL 2022-12), discount -6.0R. -12R would have sold XRP/ADA/AVAX/XLM at the 2025-10-10
                                         # flash-crash low (they recovered to -1.6..-3.0R): -39R. Tighter stops lose money
                                         # (edge report "Disaster stop" + correction, 2026-10-03)
cooldown_h: 24                           # after a stop-out: no new entry on that coin for that strategy

strategies:
  wick: true                             # PREREG-WICK-CATCHER rules (TP pre-wick close or 24h) with the v2 ladder / add-on below
  discount: true                         # PREREG-PERP-DISCOUNT rules (basis < -30 bps, 4h hold) with the v2 BTC filter below

# v2 (owner order 2026-10-04 "Build into the engine"; edge report "Improving the wick/discount engine"). 2024-26 at the same
# $/R: +346R vs +209R, max drawdown -68R vs -84R, worst day -38R vs -50R (each change passed alone; combination tested once).
wick_ladder: [5.0, 6.5, 8.0]             # bid depths in ATR1h, R split equally (1/3 R each); [5.0] = the v1 single bid
wick_addon_btc_dump: -0.017              # second unit per rung fill when BTC <= -1.7% vs the bid-hour close; null = off
discount_btc_fall: -0.01                 # discount entries only when BTC 1h <= -1%; null = off

leverage: 20                             # per symbol, set at start. 2026-10-05 ($100 test): cross-margin liquidation follows the
                                         # maintenance margin, not this setting; 20x leaves free margin so crash-time rungs/add-ons aren't rejected
margin_type: CROSSED
max_open_legs: 140                       # 20 coins x 3 rungs x 2 (add-ons) + 20 discount
equity_floor_usd: 60                     # live: pause new entries when the REALIZED wallet balance < $60 (open losses don't count, so
                                         # crash lows never pause entries); $100 start, closed-trade max DD top-6 since 2020: -$15

# 2026-10-05 owner: "$100" + "limit the number of pairs while we test": the 6 most liquid of the 20 by trailing-12-month
# volume (not by past results). At $1/R: since 2024 +$90, closed-trade max DD -$15, worst crash moment -$61 (2025-10-10,
# all lows in one 5m bar) vs -$203 for all 20. BTC must stay in (add-on + discount filters read it). Full list:
# [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT, AVAXUSDT, DOTUSDT, LTCUSDT,
#  BCHUSDT, ATOMUSDT, NEARUSDT, UNIUSDT, FILUSDT, ETCUSDT, TRXUSDT, BNBUSDT, XLMUSDT, AAVEUSDT]
universe: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, BNBUSDT]

db: /root/bitana/data/wd_engine.db
status_file: /root/bitana/data/wd_engine_status.json
pause_file: /root/bitana/data/wd_engine.PAUSE   # touch to stop new entries (open legs keep their exits)
log_file: /root/bitana/logs/wd_engine.log
log_level: INFO
telegram: true                           # entries / exits / errors, tagged WD[dry] / WD[testnet] / WD
telegram_env: /root/bitana/.env
